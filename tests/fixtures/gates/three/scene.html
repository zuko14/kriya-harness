<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>G-3D fixture scene</title>
  </head>
  <body style="margin: 0">
    <main id="root"></main>
    <p>A spinning set of coloured triangles (the scene's fallback text).</p>
    <script>
      // WT-GATE-3D fixture: one raw-WebGL scene; ?mode=a,b picks its faults.
      //   clean (default)  caps DPR at 1.5, handles context loss, disposes on unmount
      //   blank            clears to one colour, draws nothing
      //   shader           a fragment shader that doesn't compile
      //   leak             unmount keeps every GPU object and the context
      //   draws            2,000 draw calls a frame
      //   noloss           no webglcontextlost handler
      //   dpr              the pixel ratio follows devicePixelRatio uncapped
      //   static           motion declared, nothing moves
      //   ignorereduce     keeps spinning under prefers-reduced-motion
      //   bigtex           two 4096² RGBA textures (128 MB)
      //   spoof            tries to replace the gate's reader with flattering numbers
      const modes = new Set((new URLSearchParams(location.search).get("mode") || "clean").split(","))
      const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches && !modes.has("ignorereduce")
      if (modes.has("spoof")) {
        try {
          window.__kriya3dRead = () => ({ contexts: 1, frames: 9999, recent: [], errors: 0, live: {}, textureBytes: 0, bufferBytes: 0 })
        } catch {}
        try {
          Object.defineProperty(window, "__kriya3dRead", { value: () => ({ frames: 9999 }) })
        } catch {}
      }
      let canvas, gl, prog, buf, textures, raf
      const VS = "attribute vec2 p; attribute vec3 c; varying vec3 v; uniform float t; void main(){ v=c; float s=sin(t), k=cos(t); gl_Position=vec4(p.x*k-p.y*s, p.x*s+p.y*k, 0.0, 1.0); }"
      const FS = modes.has("shader") ? "precision mediump float; void main(){ gl_FragColor = vec4(oops); }" : "precision mediump float; varying vec3 v; void main(){ gl_FragColor = vec4(v, 1.0); }"
      function shader(type, src) {
        const s = gl.createShader(type)
        gl.shaderSource(s, src)
        gl.compileShader(s)
        if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) console.error("THREE.WebGLProgram: Shader Error " + gl.getShaderInfoLog(s))
        return s
      }
      function build() {
        prog = gl.createProgram()
        gl.attachShader(prog, shader(gl.VERTEX_SHADER, VS))
        gl.attachShader(prog, shader(gl.FRAGMENT_SHADER, FS))
        gl.linkProgram(prog)
        const data = []
        for (let i = 0; i < 12; i++) {
          const a = (i / 12) * Math.PI * 2
          const b = ((i + 1) / 12) * Math.PI * 2
          const col = [0.5 + 0.5 * Math.cos(a), 0.5 + 0.5 * Math.cos(a + 2.1), 0.5 + 0.5 * Math.cos(a + 4.2)]
          data.push(0, 0, 1, 1, 1, 0.8 * Math.cos(a), 0.8 * Math.sin(a), ...col, 0.8 * Math.cos(b), 0.8 * Math.sin(b), ...col)
        }
        buf = gl.createBuffer()
        gl.bindBuffer(gl.ARRAY_BUFFER, buf)
        gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(data), gl.STATIC_DRAW)
        textures = []
        for (const n of modes.has("bigtex") ? [4096, 4096] : [4]) {
          const t = gl.createTexture()
          gl.bindTexture(gl.TEXTURE_2D, t)
          gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, n, n, 0, gl.RGBA, gl.UNSIGNED_BYTE, null)
          textures.push(t)
        }
      }
      function size() {
        const dpr = modes.has("dpr") ? devicePixelRatio : Math.min(devicePixelRatio, 1.5)
        const w = Math.round(canvas.clientWidth * dpr)
        const h = Math.round(canvas.clientHeight * dpr)
        if (canvas.width !== w || canvas.height !== h) {
          canvas.width = w
          canvas.height = h
        }
      }
      function frame(now) {
        raf = requestAnimationFrame(frame)
        if (gl.isContextLost()) return
        size()
        gl.viewport(0, 0, canvas.width, canvas.height)
        gl.clearColor(0.08, 0.1, 0.12, 1)
        gl.clear(gl.COLOR_BUFFER_BIT)
        if (modes.has("blank")) return
        gl.useProgram(prog)
        gl.bindBuffer(gl.ARRAY_BUFFER, buf)
        const p = gl.getAttribLocation(prog, "p")
        const c = gl.getAttribLocation(prog, "c")
        if (p >= 0) {
          gl.enableVertexAttribArray(p)
          gl.vertexAttribPointer(p, 2, gl.FLOAT, false, 20, 0)
        }
        if (c >= 0) {
          gl.enableVertexAttribArray(c)
          gl.vertexAttribPointer(c, 3, gl.FLOAT, false, 20, 8)
        }
        gl.uniform1f(gl.getUniformLocation(prog, "t"), reduce || modes.has("static") ? 0.3 : now / 700)
        const n = modes.has("draws") ? 2000 : 3
        for (let i = 0; i < n; i++) gl.drawArrays(gl.TRIANGLES, (i % 3) * 12, 12)
      }
      function mount() {
        canvas = document.createElement("canvas")
        canvas.style.cssText = "display:block;width:100%;height:320px"
        document.getElementById("root").append(canvas)
        gl = canvas.getContext("webgl2") || canvas.getContext("webgl")
        if (!modes.has("noloss")) canvas.addEventListener("webglcontextlost", (e) => e.preventDefault())
        canvas.addEventListener("webglcontextrestored", build)
        build()
        raf = requestAnimationFrame(frame)
      }
      function unmount() {
        cancelAnimationFrame(raf)
        if (!modes.has("leak")) {
          gl.deleteBuffer(buf)
          for (const t of textures) gl.deleteTexture(t)
          gl.deleteProgram(prog)
          gl.getExtension("WEBGL_lose_context")?.loseContext()
        }
        canvas.remove()
      }
      addEventListener("popstate", () => (location.pathname === "/away" ? unmount() : canvas.isConnected || mount()))
      mount()
    </script>
  </body>
</html>
