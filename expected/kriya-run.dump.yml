          (process.env.KRIYA_ALLOWED_TIERS ||
          'balanced,budget,escalation').split(',').includes(id)) .map(([id,
          name]) => ({ id, name: typeof names[id] === 'string' && names[id] ?
          names[id] : name, ...((process.env.KRIYA_MODEL_IMAGES ||
          '').split(',').includes(id) ? { input: ['text', 'image'] } : {}),
          ...(limits[id] ? { contextWindow: limits[id].contextWindow, maxTokens:
          limits[id].maxTokens } : {}) }))) ((() => { try { return
          JSON.parse(process.env.KRIYA_MODEL_NAMES || '{}') } catch { return {}
          } })(), (() => { try { return
