# == @deepseek-ai/dsh-base, patched by @kriya-ai/harness
- id: approval
  name: '@deepseek-ai/dsh-user-approval'
  config:
    policy: !!js 'process.env.KRIYA_APPROVAL === ''never'' ? ''never'' : ''ask'''
- id: permission
  name: '@deepseek-ai/dsh-permission-presets'
  config:
    presets:
      ask:
        sandbox: workspace-write
        approval: ask
        name: Ask
        description: >-
          Works in this folder and asks before anything beyond it, here or in
          Kriya on your phone.
      folder-auto:
        sandbox: workspace-write
        approval: never
        name: Auto
        description: >-
          Works in this folder without asking; anything that would need your OK
          is refused instead.
      read-only:
        sandbox: read-only
        approval: never
        name: Read only
        description: Reads and answers; changes no file.
      full-access:
        sandbox: danger-full-access
        approval: never
        name: Full access
        description: >-
          No sandbox and no questions. Only on a machine you can afford to
          change.
    defaultPreset: !!js >-
      ['ask', 'folder-auto', 'read-only',
      'full-access'].includes(process.env.KRIYA_PRESET) ?
      process.env.KRIYA_PRESET : 'ask'
