# The "kriya" bundle (Kriya Harness, built on DeepSeek Harness): patch rows
# applied over dsh-base and the surface bundle (dsh-web-app or
# dsh-headless) in every Kriya profile. HD-02: nothing in DSH is edited;
# Kriya is added through configuration rows. HT-REL-03 checks the composed
# result of each profile against expected/.

# P-GW: the only model route is the Kriya gateway. The address, the client
# version and the device token come from the launcher (src/launch.js);
# apiKeyEnv is a credential reference DSH resolves per request, so the
# token never enters a config file. Tiers are Kriya's aliases; Kriya maps
# them to models on the server.
- id: llm-pi-ai
  config:
    providers:
      kriya:
        displayName: Kriya
        api: openai-completions
        baseURL: !!js process.env.KRIYA_GATEWAY_URL ?? 'http://127.0.0.1:9/kriya-signed-out'
        apiKeyEnv: KRIYA_DEVICE_TOKEN
        headers:
          X-Kriya-Harness: !!js process.env.KRIYA_CLIENT_VERSION ?? '0.0.0'
        # Only the tiers the plan allows (the launcher reads GET /models into
        # KRIYA_ALLOWED_TIERS): a tier the plan refuses would fail every
        # request with tier_not_allowed. Unset, all three. Each is named
        # after the model the owner routes it to (KRIYA_MODEL_NAMES, from the
        # same answer), else "Kriya <tier>"
        # Harness upgrade U3: a tier Kriya gives limits for (KRIYA_MODEL_LIMITS,
        # from GET /models) declares its model's context window and output
        # cap; the others keep DSH's defaults (262,144 and 32,768). A tier
        # Kriya says takes images (KRIYA_MODEL_IMAGES) declares it, else
        # DSH refuses every image for it
        models: !!js >-
          ((names, limits) => [['balanced', 'Kriya balanced'], ['budget', 'Kriya budget'], ['escalation', 'Kriya escalation']]
          .filter(([id]) => (process.env.KRIYA_ALLOWED_TIERS || 'balanced,budget,escalation').split(',').includes(id))
          .map(([id, name]) => ({ id, name: typeof names[id] === 'string' && names[id] ? names[id] : name,
          ...((process.env.KRIYA_MODEL_IMAGES || '').split(',').includes(id) ? { input: ['text', 'image'] } : {}),
          ...(limits[id] ? { contextWindow: limits[id].contextWindow, maxTokens: limits[id].maxTokens } : {}) })))
          ((() => { try { return JSON.parse(process.env.KRIYA_MODEL_NAMES || '{}') } catch { return {} } })(),
          (() => { try { return JSON.parse(process.env.KRIYA_MODEL_LIMITS || '{}') } catch { return {} } })())

# Harness upgrade U3: compaction headroom per tier from the same limits, so
# DSH's trigger (W − O − headroom) stays positive on a small window. No
# limits, no policies: DSH's defaults, as before
- id: compaction-basic
  config:
    modelPolicies: !!js >-
      Object.entries((() => { try { return JSON.parse(process.env.KRIYA_MODEL_LIMITS || '{}') } catch { return {} } })())
      .map(([model, l]) => ({ provider: 'kriya', model, headroomTokens: l.headroomTokens }))

# The starting tier: balanced, or the best tier the plan allows, chosen by
# the launcher from GET /models (src/launch.js startTier)
- id: agent-default-model
  config:
    provider: kriya
    model: !!js process.env.KRIYA_START_TIER ?? 'balanced'

# H11 (HD-13): ACP sessions start on the same route. dsh-acp-app's row names
# DeepSeek's own provider and model; this replaces its config (only the
# kriya-acp profile has the row)
- id: acp
  config:
    provider: kriya
    model: !!js process.env.KRIYA_START_TIER ?? 'balanced'

# DeepSeek's own account, models and web search need a DeepSeek sign-in or
# key; the Kriya Harness uses Kriya's gateway instead
- id: deepseek-account
  disabled: true
- id: llm-deepseek
  disabled: true
- id: llm-deepseek-account
  disabled: true
- id: web-search-deepseek
  disabled: true
- id: web-deepseek-api
  disabled: true
# The session-log field rides only official DeepSeek API requests (above,
# disabled); off outright, with its "Help improve DeepSeek models" switch in
# the Web UI's Settings → General
- id: session-log-deepseek
  disabled: true
- id: ui-settings-session-log
  disabled: true
# The Web UI's DeepSeek account page and its controller (which would wait
# forever for the disabled account service); no-ops in the headless profile
- id: account-controller
  disabled: true
- id: ui-settings-account
  disabled: true

# The Web UI shows Kriya, not DeepSeek: the official brand row is off and
# Kriya's brand plugin (plugins/brand: sidebar mark and name, hero mark,
# tab title and icon) fills the same slots, as that row's README asks of
# other identities. In the headless profile its node half does nothing
- id: ui-brand-official
  disabled: true
- insert:
    - id: ui-brand-kriya
      name: '@kriya-ai/harness-brand'

# A file's version in DSH includes ctime, which iCloud and backup tools bump
# with the content untouched: on a real task in ~/Documents, 40 of 146 edits
# failed as "changed since it was read". plugins/fs-freshness looks past that
- insert:
    - id: kriya-fs-freshness
      name: '@kriya-ai/harness-fs-freshness'

# Kriya Harness is one product: its features come from Kriya, not from
# DeepSeek Harness's plugin ecosystem. Off: Creator mode (the `cordis`
# preset, which writes DSH plugins), its panel, the "Create a DSH plugin"
# menu entries, the sidebar Plugins page (installs DSH bundles and could
# switch Kriya's own rows off) and Settings → Built-in plugins (a list of
# DSH packages). DSH hides its own "create a preset" button when the
# `cordis` preset is absent. In profiles without these rows they're no-ops
- id: preset-cordis
  disabled: true
- id: ui-cordis
  disabled: true
- id: entry-customization
  disabled: true
- id: ui-plugin-manager
  disabled: true
- id: ui-settings-plugins
  disabled: true
- id: ui-settings-plugin-inventory
  disabled: true

# The Projects page (plugins/projects): the folders on this computer that
# look like projects, each opened as a workspace and a session in a click.
# One read-only route inside Connection's fence; without the web server it
# doesn't start
- insert:
    - id: kriya-projects
      name: '@kriya-ai/harness-projects'
      # Web UI only: it needs the web server's connection, which the other profiles lack
      disabled: !!js ctx.get('profileContext')?.name !== 'kriya'

# The Editing Studio row (plugins/edit, track E): an "Editing Studio" row in the
# sidebar that opens the Edit Host's own Studio app in the same tab, through one
# route inside Connection's fence. Off unless kriya was started with --edit
# (KRIYA_EDIT=on): off, no row, route or DOM exists and nothing under src/edit loads
- insert:
    - id: kriya-edit
      name: '@kriya-ai/harness-edit'
      # Web UI only, and only with the switch on
      disabled: !!js process.env.KRIYA_EDIT !== 'on' || ctx.get('profileContext')?.name !== 'kriya'

# H14a, the Kriya loop's verify step (plugins/loop): kriya_verify runs the
# project's check the person confirmed (`kriya verify use`) under the
# session's own sandbox and reports pass, fail or blocked from its exit
# code. Off unless kriya was started with --loop (KRIYA_LOOP=on): off, the
# agent's prompt and tools are exactly as before
- insert:
    - id: kriya-loop
      name: '@kriya-ai/harness-loop'
      disabled: !!js process.env.KRIYA_LOOP !== 'on'

# Harness upgrade U2 (plugins/budget): a turn is bounded by code: at most
# KRIYA_MAX_STEPS steps (150), KRIYA_TURN_MINUTES minutes (60) and
# KRIYA_MAX_REPEATS identical tool calls in a row (10); near a limit the agent
# is told once to wrap up, at a limit the turn ends "blocked". Off unless
# kriya was started with --budget (KRIYA_BUDGET=on): off, the agent is
# exactly as before
- insert:
    - id: kriya-budget
      name: '@kriya-ai/harness-budget'
      disabled: !!js process.env.KRIYA_BUDGET !== 'on'

# Harness upgrade U7 (plugins/anchor): the person's own messages, word for
# word, in a late system-prompt section that compaction never condenses, so
# a requirement survives a summary that drops it. Off unless kriya was
# started with --anchor (KRIYA_ANCHOR=on)
- insert:
    - id: kriya-anchor
      name: '@kriya-ai/harness-anchor'
      disabled: !!js process.env.KRIYA_ANCHOR !== 'on'

# Harness upgrade U6: KriyaBench's tool-minimal control arm (arm B0,
# BENCHMARK_PLAN.md): the same sandbox, gateway, model and prompt, with only
# the shell and the file and search tools, so a run shows whether the rest
# of the tool list helps or hurts. A benchmark switch only: KRIYA_MINIMAL=on
# in the shell that runs the bench. Off, these rows are as before: on in
# kriya-run and kriya-acp, and off at the top level of the Web UI's profile
# (`kriya`), where DSH's own web bundle moves them into its agent presets
- id: tool-goal
  disabled: !!js ctx.get('profileContext')?.name === 'kriya' || process.env.KRIYA_MINIMAL === 'on'
- id: tool-subagent
  disabled: !!js ctx.get('profileContext')?.name === 'kriya' || process.env.KRIYA_MINIMAL === 'on'
- id: tool-subagent-fork
  disabled: !!js ctx.get('profileContext')?.name === 'kriya' || process.env.KRIYA_MINIMAL === 'on'
- id: tool-subagent-control
  disabled: !!js ctx.get('profileContext')?.name === 'kriya' || process.env.KRIYA_MINIMAL === 'on'
- id: tool-subagent-list-agents
  disabled: !!js ctx.get('profileContext')?.name === 'kriya' || process.env.KRIYA_MINIMAL === 'on'
- id: tool-jobs
  disabled: !!js ctx.get('profileContext')?.name === 'kriya' || process.env.KRIYA_MINIMAL === 'on'
- id: tool-todo
  disabled: !!js ctx.get('profileContext')?.name === 'kriya' || process.env.KRIYA_MINIMAL === 'on'
- id: tool-web
  disabled: !!js ctx.get('profileContext')?.name === 'kriya' || process.env.KRIYA_MINIMAL === 'on'
- id: tool-workflow
  disabled: !!js ctx.get('profileContext')?.name === 'kriya' || process.env.KRIYA_MINIMAL === 'on'
- id: tool-skill
  disabled: !!js ctx.get('profileContext')?.name === 'kriya' || process.env.KRIYA_MINIMAL === 'on'
- id: plan-mode
  disabled: !!js ctx.get('profileContext')?.name === 'kriya' || process.env.KRIYA_MINIMAL === 'on'

# The Skills page (plugins/skills): a sidebar row and page listing the
# agent's SKILL.md skills, with editing for the ones you own, on routes inside
# Connection's fence. In profiles without the web server it doesn't start
- insert:
    - id: kriya-skills
      name: '@kriya-ai/harness-skills'
      # Web UI only: it needs the web server's connection, which the other profiles lack
      disabled: !!js ctx.get('profileContext')?.name !== 'kriya'

# The Changes tab (plugins/changes): a right-sidebar page with every file
# changed in the session's folder against HEAD and its diff, read-only, on
# routes inside Connection's fence. Without the web server it doesn't start
- insert:
    - id: kriya-changes
      name: '@kriya-ai/harness-changes'
      # Web UI only: it needs the web server's connection, which the other profiles lack
      disabled: !!js ctx.get('profileContext')?.name !== 'kriya'

# The Overview tab (plugins/overview): a right-sidebar page with one session
# at a glance (this computer, the folder, the repository and branch, the
# token meter's context and usage, changed files, background jobs,
# connectors), read-only, on one route inside Connection's fence. Without
# the web server it doesn't start
- insert:
    - id: kriya-overview
      name: '@kriya-ai/harness-overview'
      # Web UI only: it needs the web server's connection, which the other profiles lack
      disabled: !!js ctx.get('profileContext')?.name !== 'kriya'

# Remote Control (plugins/remote): the switch in the Overview tab streams a
# session to the person's Kriya and listens for the Control Center while this
# app runs, with no command. Without the web server it doesn't start
- insert:
    - id: kriya-remote
      name: '@kriya-ai/harness-remote'
      # Web UI only: it needs the web server's connection, which the other profiles lack
      disabled: !!js ctx.get('profileContext')?.name !== 'kriya'

# Delete session (plugins/sessions): a row in a session's "..." menu; DSH has
# archive only. Without the web server it doesn't start
- insert:
    - id: kriya-sessions
      name: '@kriya-ai/harness-sessions'
      # Web UI only: it needs the web server's connection, which the other profiles lack
      disabled: !!js ctx.get('profileContext')?.name !== 'kriya'

# Reverse engineering (plugins/rea): two small tools over the pinned REA MCP
# server, started on first use, and its guidance only on such requests. Off in
# KriyaBench's tool-minimal arm
- insert:
    - id: kriya-rea
      name: '@kriya-ai/harness-rea'
      disabled: !!js process.env.KRIYA_MINIMAL === 'on'

# The Progress tab (plugins/progress): what the Kriya loop recorded for a
# session (goal, plan, each step's status and attempts, every check run and
# the verdict against the files now), read-only, on one route inside
# Connection's fence. Without the web server it doesn't start
- insert:
    - id: kriya-progress
      name: '@kriya-ai/harness-progress'
      # Web UI only: it needs the web server's connection, which the other profiles lack
      disabled: !!js ctx.get('profileContext')?.name !== 'kriya'

# The Preview tab (plugins/preview, browser stage 1): an app on this
# computer (localhost only, never the Web UI's own port) in a frame, with an
# address bar and "open in your browser". Browser half only
- insert:
    - id: kriya-preview
      name: '@kriya-ai/harness-preview'

# The Graph tab (plugins/graph): the session's plan drawn as a graph, from the
# Progress tab's own route. Browser half only; a flow is designed in Kriya
- insert:
    - id: kriya-graph
      name: '@kriya-ai/harness-graph'

# Browser stage 2 (plugins/browser): the agent's browser for apps on this
# computer (localhost only) on the installed Chrome, and the routes the
# Preview tab's "Agent's browser" view uses. Off unless kriya was started
# with --browser-tools (KRIYA_BROWSER=on): off, no tool, route or Chrome exists
- insert:
    - id: kriya-browser
      name: '@kriya-ai/harness-browser'
      # Off in KriyaBench's tool-minimal arm (KRIYA_MINIMAL=on), which keeps only the shell, files and search
      disabled: !!js process.env.KRIYA_BROWSER !== 'on' || process.env.KRIYA_MINIMAL === 'on'

# The intent router (plugins/router): for the person's latest message, a
# short brief of the skills likely to help and the tools to start with, in
# a late prompt section. Hides and adds nothing. Off unless kriya was
# started with --router (KRIYA_ROUTER=on): off, the prompt is as before
- insert:
    - id: kriya-router
      name: '@kriya-ai/harness-router'
      disabled: !!js process.env.KRIYA_ROUTER !== 'on'

# Kriya modes (src/modes.js): the launcher sets KRIYA_SANDBOX,
# KRIYA_APPROVAL and KRIYA_PRESET from `--mode`; anything else falls back
# to Ask (the HD-02 default: workspace-write, approvals ask). DSH's `never`
# refuses what would need approval, so Auto and Read only never escalate.
# The preset table is the Web UI's Permissions selector and /permission
- id: sandbox-policy
  config:
    mode: !!js >-
      ['read-only', 'workspace-write', 'danger-full-access'].includes(process.env.KRIYA_SANDBOX)
      ? process.env.KRIYA_SANDBOX : 'workspace-write'
    workspaceRoot: !!js process.cwd()
- id: approval
  config:
    policy: !!js >-
      process.env.KRIYA_APPROVAL === 'never' ? 'never' : 'ask'
- id: permission
  config:
    presets:
      ask:
        sandbox: workspace-write
        approval: ask
        name: Ask
        description: Works in this folder and asks before anything beyond it, here or in Kriya on your phone.
      folder-auto:
        sandbox: workspace-write
        approval: never
        name: Auto
        description: Works in this folder without asking; anything that would need your OK is refused instead.
      read-only:
        sandbox: read-only
        approval: never
        name: Read only
        description: Reads and answers; changes no file.
      full-access:
        sandbox: danger-full-access
        approval: never
        name: Full access
        description: No sandbox and no questions. Only on a machine you can afford to change.
    defaultPreset: !!js >-
      ['ask', 'folder-auto', 'read-only', 'full-access'].includes(process.env.KRIYA_PRESET)
      ? process.env.KRIYA_PRESET : 'ask'

# H5 (HD-08): DSH's approval requests also go to Kriya, so the person can
# answer on their phone; first answer wins, no answer fails closed. Both
# profiles: in the headless one it's the only answerer (plugins/approvals)
- insert:
    - id: kriya-approvals
      name: '@kriya-ai/harness-approvals'

# H6 (HD-09): a summary of each turn in a Kriya thread, only when the person
# turned the mirror on for this device in Kriya (plugins/mirror). Local
# history stays DSH's own
- insert:
    - id: kriya-mirror
      name: '@kriya-ai/harness-mirror'

# H7 (HD-10): the device agent's Kriya skills as a skill source (local
# skills win a name) and kriya_memory_search / kriya_memory_save; notes
# saved from here stay unconfirmed until the person confirms them in Kriya
- insert:
    - id: kriya-tools
      name: '@kriya-ai/harness-tools'
      disabled: !!js process.env.KRIYA_MINIMAL === 'on'

# DSH's first-run "Preview Notice" speaks for DeepSeek Harness; Kriya shows
# its own beta notice at first run (bin/kriya.js) and in SAFETY.md, which
# say DSH is an unaudited preview. Marked as seen with DSH's own
# acknowledgement field; a DSH bump that changes the version shows it again
# and changes the recorded dump (HT-REL-03)
- id: ui-settings-general
  config:
    welcomeNoticeVersion: '2026-09-28.1'

# HD-17: no telemetry leaves the machine
- id: otel
  disabled: true
- id: session-telemetry-otel
  disabled: true
# Web UI only (no such rows in the headless profile, where they're no-ops);
# DSH turns these on only for its desktop profile, Kriya turns them off outright
- id: desktop-product-telemetry
  disabled: true
- id: product-analytics
  disabled: true

# The agent's identity is Kriya's (owner, 2026-11-06: "completely this was a
# Kriya harness product"): DSH's fixed opener names DeepSeek Harness, so it is
# off and the persona line, which DSH documents for "deployments with another
# identity", says Kriya instead. DSH stays credited in `kriya --version`,
# SAFETY.md and THIRD_PARTY_NOTICES.md (its MIT licence)
- id: system-prompt
  config:
    includeHarnessIdentity: false
    personaPrefix: You are Kriya, a coding agent in Kriya Harness, working with the {{model}} model.
