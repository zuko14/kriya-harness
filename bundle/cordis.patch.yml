# The "kriya" bundle (Kriya Harness, built on DeepSeek Harness): patch rows
# applied over dsh-base and the surface bundle (dsh-web-app or
# dsh-headless) in every Kriya profile. HD-02: nothing in DSH is edited;
# Kriya is added through configuration rows. HT-REL-03 checks the composed
# result of each profile against expected/.

# P-GW: the only model route is the Kriya gateway. The address, the client
# version and the device token come from the launcher (src/launch.js);
# apiKeyEnv is a credential reference DSH resolves per request, so the
# token never enters a config file. Tiers are Kriya's aliases; Kriya maps
# them to models on the server.
- id: llm-pi-ai
  config:
    providers:
      kriya:
        displayName: Kriya
        api: openai-completions
        baseURL: !!js process.env.KRIYA_GATEWAY_URL ?? 'http://127.0.0.1:9/kriya-signed-out'
        apiKeyEnv: KRIYA_DEVICE_TOKEN
        headers:
          X-Kriya-Harness: !!js process.env.KRIYA_CLIENT_VERSION ?? '0.0.0'
        models:
          - id: balanced
            name: Kriya balanced
          - id: budget
            name: Kriya budget
          - id: escalation
            name: Kriya escalation

- id: agent-default-model
  config:
    provider: kriya
    model: balanced

# H11 (HD-13): ACP sessions start on the same route. dsh-acp-app's row names
# DeepSeek's own provider and model; this replaces its config (only the
# kriya-acp profile has the row)
- id: acp
  config:
    provider: kriya
    model: balanced

# DeepSeek's own account, models and web search need a DeepSeek sign-in or
# key; the Kriya Harness uses Kriya's gateway instead
- id: deepseek-account
  disabled: true
- id: llm-deepseek
  disabled: true
- id: llm-deepseek-account
  disabled: true
- id: web-search-deepseek
  disabled: true
- id: web-deepseek-api
  disabled: true
# The Web UI's DeepSeek account page and its controller (which would wait
# forever for the disabled account service); no-ops in the headless profile
- id: account-controller
  disabled: true
- id: ui-settings-account
  disabled: true

# The Web UI shows Kriya, not DeepSeek: the official brand row is off and
# Kriya's brand plugin (plugins/brand: sidebar mark and name, hero mark,
# tab title and icon) fills the same slots, as that row's README asks of
# other identities. In the headless profile its node half does nothing
- id: ui-brand-official
  disabled: true
- insert:
    - id: ui-brand-kriya
      name: '@kriya-ai/harness-brand'

# H5 (HD-08): DSH's approval requests also go to Kriya, so the person can
# answer on their phone; first answer wins, no answer fails closed. Both
# profiles: in the headless one it's the only answerer (plugins/approvals)
- insert:
    - id: kriya-approvals
      name: '@kriya-ai/harness-approvals'

# H6 (HD-09): a summary of each turn in a Kriya thread, only when the person
# turned the mirror on for this device in Kriya (plugins/mirror). Local
# history stays DSH's own
- insert:
    - id: kriya-mirror
      name: '@kriya-ai/harness-mirror'

# H7 (HD-10): the device agent's Kriya skills as a skill source (local
# skills win a name) and kriya_memory_search / kriya_memory_save; notes
# saved from here stay unconfirmed until the person confirms them in Kriya
- insert:
    - id: kriya-tools
      name: '@kriya-ai/harness-tools'

# DSH's first-run "Preview Notice" speaks for DeepSeek Harness; Kriya shows
# its own beta notice at first run (bin/kriya.js) and in SAFETY.md, which
# say DSH is an unaudited preview. Marked as seen with DSH's own
# acknowledgement field; a DSH bump that changes the version shows it again
# and changes the recorded dump (HT-REL-03)
- id: ui-settings-general
  config:
    welcomeNoticeVersion: '2026-09-28.1'

# HD-17: no telemetry leaves the machine
- id: otel
  disabled: true
- id: session-telemetry-otel
  disabled: true
# Web UI only (no such rows in the headless profile, where they're no-ops);
# DSH turns these on only for its desktop profile, Kriya turns them off outright
- id: desktop-product-telemetry
  disabled: true
- id: product-analytics
  disabled: true
