# Client CI (TEST_STRATEGY: HT-REL-01…03, contract tests, kriya doctor and
# kriya run against the fake gateway). No secrets, no network beyond npm:
# every test talks to tests/fake-kriya.js on 127.0.0.1.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.9"
          cache: npm
      - run: npm ci
      - run: npm run check
  # Harness upgrade U5 (KU-ADR-18): the DeepSeek Harness compatibility gate,
  # its own check so a DSH break is named on the pull request: the seams
  # Kriya depends on (check:seams), then KriyaBench-M on the pinned DSH with
  # a scripted model (turn budget, overflow recovery, model limits, resume,
  # stream cut, kept request, stale pass, control arms). Also part of `check`
  dsh-compatibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.9"
          cache: npm
      - run: npm ci
      - run: npm run check:seams
      - run: node --test tests/upgrade-run.test.js tests/drills-run.test.js tests/seams.test.js
  # The release gate (HG-5): exact pins, every license on the allow-list or
  # an owner-decided exception (notices-exceptions.json, HF-09), notices
  # current; then the release's SBOM (CycloneDX) as a build artifact
  release-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.9"
          cache: npm
      - run: npm ci
      - run: npm run release:check
      - run: npm run -s sbom > sbom.cdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.cdx.json
