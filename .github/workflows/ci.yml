# Client CI (TEST_STRATEGY: HT-REL-01…03, contract tests, kriya doctor and
# kriya run against the fake gateway). No secrets, no network beyond npm:
# every test talks to tests/fake-kriya.js on 127.0.0.1.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.9"
          cache: npm
      - run: npm ci
      - run: npm run check
  # The release gate (HG-5): exact pins, every license on the allow-list or
  # an owner-decided exception (notices-exceptions.json, HF-09), notices
  # current; then the release's SBOM (CycloneDX) as a build artifact
  release-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.9"
          cache: npm
      - run: npm ci
      - run: npm run release:check
      - run: npm run -s sbom > sbom.cdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.cdx.json
